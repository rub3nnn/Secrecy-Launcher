name: Build & Publish Release

on:
  push:
    tags:
      - 'v*' # Solo se activa cuando tú subes manualmente el tag desde tu PC

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configuramos Node y caché
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Instalamos las dependencias de forma limpia
      - name: Install dependencies
        run: npm ci

      # Ejecutamos tu script de electron-vite que compila el frontend,
      # el backend y luego llamamos a electron-builder para empaquetar y publicar.
      - name: Build & Publish Electron App
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
