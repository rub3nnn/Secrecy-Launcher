name: Build & Publish Release

on:
  push:
    tags:
      - 'v*' # El bot SOLO se despierta si subes un tag como v1.1.0, v2.0.1, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build --if-present

      # Cambiamos --publish=never por --publish=always para que electron-builder
      # se encargue de subir TODO correctamente a GitHub Releases
      - name: Build & Publish Electron App
        run: npx electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
